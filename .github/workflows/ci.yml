name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check install script
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          if [ "$RUNNER_OS" = Linux ]; then
            shellcheck --severity=style install.sh
          fi
          sh install.sh --help | grep -q '^Usage: sh install.sh'
          if sh install.sh --bogus 2>/dev/null; then
            printf 'install.sh accepted an unknown flag\n'
            exit 1
          fi
          sh -s -- --help < install.sh | grep -q '^Usage: sh install.sh'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

      - name: Build both architectures and check native startup
        run: |
          os="$(go env GOOS)"
          arch="$(go env GOARCH)"
          exe="$(go env GOEXE)"
          printf 'Native runner: %s/%s\n' "$os" "$arch"
          for target_arch in amd64 arm64; do
            printf 'Building %s/%s\n' "$os" "$target_arch"
            GOOS="$os" GOARCH="$target_arch" go build -o "$RUNNER_TEMP/navigara-$os-$target_arch$exe" .
          done
          output="$RUNNER_TEMP/startup-output"
          errors="$RUNNER_TEMP/startup-errors"
          "$RUNNER_TEMP/navigara-$os-$arch$exe" --help > "$output" 2> "$errors"
          if ! grep -q 'Usage: navigara' "$output" || [ -s "$errors" ]; then
            printf 'Native help did not match the CLI contract:\n'
            cat "$output"
            cat "$errors"
            exit 1
          fi
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\navigara-windows-amd64.exe"
          foreach ($ps in 'pwsh', 'powershell') {
            $prefix = "$env:RUNNER_TEMP\install-$ps"
            & $ps -NoProfile -ExecutionPolicy Bypass -File install.ps1 -LocalFile $exe -Prefix $prefix -NoWizard
            if ($LASTEXITCODE -ne 0) { throw "$ps could not install the local file" }
            & "$prefix\navigara.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "$ps installed a binary that does not start" }
          }
          & pwsh -NoProfile -File install.ps1 -NoWizard 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 installed without a pinned digest' }
          $global:LASTEXITCODE = 0
          Copy-Item install.ps1 $env:RUNNER_TEMP
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navigara-windows
          path: |
            ${{ runner.temp }}/navigara-windows-*.exe
            ${{ runner.temp }}/install.ps1

  detect-changes:
    name: detect-changes
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_RESULT: ${{ needs.ci.result }}
    steps:
      - name: Require every job to succeed
        run: |
          printf 'CI: %s\n' "$CI_RESULT"
          if [ "$CI_RESULT" != success ]; then
            exit 1
          fi
