name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

      - name: Build both architectures and check native startup
        run: |
          os="$(go env GOOS)"
          arch="$(go env GOARCH)"
          printf 'Native runner: %s/%s\n' "$os" "$arch"
          for target_arch in amd64 arm64; do
            printf 'Building %s/%s\n' "$os" "$target_arch"
            GOOS="$os" GOARCH="$target_arch" go build -o "$RUNNER_TEMP/navigara-$os-$target_arch" .
          done
          output="$RUNNER_TEMP/startup-output"
          errors="$RUNNER_TEMP/startup-errors"
          "$RUNNER_TEMP/navigara-$os-$arch" --help > "$output" 2> "$errors"
          if ! grep -q 'Usage: navigara' "$output" || [ -s "$errors" ]; then
            printf 'Native help did not match the CLI contract:\n'
            cat "$output"
            cat "$errors"
            exit 1
          fi

  detect-changes:
    name: detect-changes
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_RESULT: ${{ needs.ci.result }}
    steps:
      - name: Require every job to succeed
        run: |
          printf 'CI: %s\n' "$CI_RESULT"
          if [ "$CI_RESULT" != success ]; then
            exit 1
          fi
