name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build both architectures and check native startup
        run: |
          os="$(go env GOOS)"
          arch="$(go env GOARCH)"
          printf 'Native runner: %s/%s\n' "$os" "$arch"
          for target_arch in amd64 arm64; do
            printf 'Building %s/%s\n' "$os" "$target_arch"
            GOOS="$os" GOARCH="$target_arch" go build -o "$RUNNER_TEMP/navigara-$os-$target_arch" .
          done
          output="$RUNNER_TEMP/startup-output"
          "$RUNNER_TEMP/navigara-$os-$arch" > "$output" 2>&1
          if [ -s "$output" ]; then
            printf 'Native startup unexpectedly emitted output:\n'
            cat "$output"
            exit 1
          fi

  detect-changes:
    name: detect-changes
    if: always()
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Require every job to succeed
        run: |
          printf 'Quality: %s\nBuild: %s\n' "$QUALITY_RESULT" "$BUILD_RESULT"
          if [ "$QUALITY_RESULT" != success ] || [ "$BUILD_RESULT" != success ]; then
            exit 1
          fi
